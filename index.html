/* =========================================================
   POWERPOINT EXPORT — FAITHFUL DECK REPRODUCTION
   ========================================================= */
const dlBtn = document.getElementById('dlBtn');
const dlbar = document.getElementById('dlbar');

/* ---------- geometry (inches) ---------- */
const SW = 10, SH = 5.63;
const MX = 0.45;
const CW = SW - MX * 2;
const CTOP = 1.12;
const CBOT = 5.20;

/* ---------- palette ---------- */
const C = {
  brand:'0D6E6E', brand2:'0F8B8B', brandSoft:'E2F4F3',
  ink:'000000', ink2:'000000', ink3:'000000',
  line:'D8E3EC', surface:'FFFFFF', surface2:'F6F9FB',
  accent:'C2410C', accentSoft:'FDECE3',
  ok:'15803D', okSoft:'E6F6EC',
  bad:'B91C1C', badSoft:'FDEAEA',
  warn:'A16207', warnSoft:'FDF4E3',
  violet:'6D28D9', violetSoft:'F3E8FF'
};

const FONT = 'Segoe UI';

let SLIDE_NO = 0;
let IMG_MAP = new Map();

/* ---------- text metrics ---------- */
function estLines(text, fontSize, widthIn){
  if(!text) return 0;
  const charW = fontSize * 0.50 / 72;
  const per = Math.max(6, Math.floor(widthIn / charW));
  return Math.max(1, Math.ceil(text.length / per));
}
function textH(text, fontSize, widthIn){
  return estLines(text, fontSize, widthIn) * fontSize * 1.34 / 72;
}
function clean(t){ return (t || '').replace(/\s+/g,' ').trim(); }

/* ---------- pill helpers ---------- */
function pillColor(el){
  if(el.classList.contains('a'))  return C.accent;
  if(el.classList.contains('ok')) return C.ok;
  if(el.classList.contains('w'))  return C.warn;
  if(el.classList.contains('v'))  return C.violet;
  return C.brand;
}
function pillBg(el){
  if(el.classList.contains('a'))  return C.accentSoft;
  if(el.classList.contains('ok')) return C.okSoft;
  if(el.classList.contains('w'))  return C.warnSoft;
  if(el.classList.contains('v'))  return C.violetSoft;
  return C.brandSoft;
}

/* ---------- rich-text extraction ---------- */
function inlineRuns(el, base){
  const runs = [];
  const walk = (node, opts) => {
    node.childNodes.forEach(n => {
      if(n.nodeType === 3){
        const t = n.textContent.replace(/\s+/g,' ');
        if(!t) return;
        if(!t.trim()){ if(runs.length) runs.push({text:' ', options:Object.assign({},opts)}); return; }
        runs.push({text:t, options:Object.assign({},opts)});
      } else if(n.nodeType === 1){
        const tag = n.tagName.toLowerCase();
        if(tag === 'br'){ runs.push({text:'\n', options:Object.assign({},opts)}); return; }
        const o = Object.assign({}, opts);
        if(tag === 'b' || tag === 'strong') o.bold = true;
        if(tag === 'em' || tag === 'i')     o.italic = true;
        if(n.classList.contains('pill')){ o.bold = true; o.color = pillColor(n); }
        if(n.classList.contains('ref')){  o.bold = true; o.color = C.brand; }
        walk(n, o);
      }
    });
  };
  walk(el, base);
  return runs;
}

/* =========================================================
   BLOCK RENDERERS
   ========================================================= */
function renderBlock(slide, el, x, y, w, dry){
  if(!el || el.nodeType !== 1) return 0;
  try{
    const cl = el.classList;
    const tag = el.tagName.toLowerCase();

    if(cl.contains('divider'))   return renderStack(slide, [...el.children], x, y, w, dry, 0.14);
    if(cl.contains('grid'))      return renderGrid(slide, el, x, y, w, dry);
    if(cl.contains('card'))      return renderCard(slide, el, x, y, w, dry);
    if(cl.contains('activity'))  return renderActivity(slide, el, x, y, w, dry);
    if(cl.contains('quiz'))      return renderQuiz(slide, el, x, y, w, dry);
    if(cl.contains('callout'))   return renderCallout(slide, el, x, y, w, dry);
    if(cl.contains('tblwrap'))   return renderTable(slide, el.querySelector('table'), x, y, w, dry);
    if(tag === 'table')          return renderTable(slide, el, x, y, w, dry);
    if(cl.contains('stat'))      return renderStat(slide, el, x, y, w, dry);
    if(cl.contains('vcard'))     return renderVCard(slide, el, x, y, w, dry);
    if(cl.contains('refrow'))    return renderPills(slide, el, x, y, w, dry);
    if(cl.contains('ref'))       return renderRefPill(slide, el, x, y, w, dry);
    if(cl.contains('kicker'))    return renderKicker(slide, el, x, y, w, dry);
    if(cl.contains('rule'))      return renderRule(slide, el, x, y, w, dry);
    if(cl.contains('qscore'))    return renderQScore(slide, el, x, y, w, dry);
    if(cl.contains('big'))       return renderBig(slide, el, x, y, w, dry);
    if(tag === 'ul' || tag === 'ol') return renderList(slide, el, x, y, w, dry);
    if(tag === 'img')            return renderImg(slide, el, x, y, w, dry);
    if(/^(h1|h2|h3|h4|p|span|div|a|blockquote)$/.test(tag)) return renderTextEl(slide, el, x, y, w, dry);
    return 0;
  }catch(err){
    console.warn('PPTX render skip:', el.className || el.tagName, err);
    return 0;
  }
}

function renderStack(slide, kids, x, y, w, dry, gap){
  gap = gap == null ? 0.12 : gap;
  let cy = y;
  kids.filter(k => k.nodeType === 1).forEach(k => {
    const h = renderBlock(slide, k, x, cy, w, dry);
    cy += h + gap;
  });
  return Math.max(0, cy - y - gap);
}
function stackHeight(slide, kids, w, gap){
  gap = gap == null ? 0.07 : gap;
  let h = 0;
  kids.filter(k => k.nodeType === 1).forEach((k, i) => {
    h += renderBlock(slide, k, 0, 0, w, true);
    if(i < kids.length - 1) h += gap;
  });
  return h;
}

function renderTextEl(slide, el, x, y, w, dry){
  const tag = el.tagName.toLowerCase();
  let fs = 12.5, bold = false, color = C.ink2, italic = false;
  if(tag === 'h1'){ fs = 32; bold = true; color = C.ink; }
  else if(tag === 'h2'){ fs = 21; bold = true; color = C.ink; }
  else if(tag === 'h3'){ fs = 13.5; bold = true; color = C.ink; }
  else if(tag === 'h4'){ fs = 10.5; bold = true; color = C.ink3; }
  if(el.classList.contains('sub')){ fs = 13.5; color = C.ink2; }
  if(el.classList.contains('num')){ return 0; }

  const txt = clean(el.textContent);
  if(!txt) return 0;

  const h = textH(txt, fs, w);
  if(!dry){
    const runs = inlineRuns(el, {fontSize:fs, color:color, bold:bold, italic:italic, fontFace:FONT});
    if(runs.length){
      slide.addText(runs, {x:x, y:y, w:w, h:h, valign:'top', fontFace:FONT, fontSize:fs, color:color, bold:bold});
    } else {
      slide.addText(txt, {x:x, y:y, w:w, h:h, valign:'top', fontFace:FONT, fontSize:fs, color:color, bold:bold});
    }
  }
  return h;
}

function renderList(slide, el, x, y, w, dry){
  const items = [...el.children].filter(c => c.tagName === 'LI');
  if(!items.length) return 0;
  const isOl = el.tagName === 'OL';
  const fs = 12;
  const inner = w - 0.22;

  let h = 0;
  const heights = items.map(li => {
    const lh = textH(clean(li.textContent), fs, inner);
    h += lh + 0.05;
    return lh;
  });
  h -= 0.05;

  if(!dry){
    const paras = [];
    items.forEach((li, i) => {
      const runs = inlineRuns(li, {fontSize:fs, color:C.ink2, fontFace:FONT});
      if(!runs.length) return;
      runs[0].options.bullet = isOl ? {type:'number'} : {code:'2022'};
      runs.forEach(r => { r.options.color = r.options.color || C.ink2; r.options.fontSize = fs; });
      runs[runs.length - 1].options.breakLine = true;
      paras.push(...runs);
    });
    if(paras.length){
      slide.addText(paras, {x:x, y:y, w:w, h:h + 0.1, valign:'top', fontFace:FONT, fontSize:fs, color:C.ink2});
    }
  }
  return h;
}

function renderKicker(slide, el, x, y, w, dry){
  const txt = clean(el.textContent).toUpperCase();
  if(!txt) return 0;
  let color = C.brand, bg = C.brandSoft;
  if(el.classList.contains('v')){ color = C.violet; bg = C.violetSoft; }
  else if(el.classList.contains('ok')){ color = C.ok; bg = C.okSoft; }
  else if(el.classList.contains('w')){ color = C.warn; bg = C.warnSoft; }

  const h = 0.28;
  const pw = Math.min(w, txt.length * 0.072 + 0.30);
  if(!dry){
    slide.addShape('roundRect', {x:x, y:y, w:pw, h:h, rectRadius:0.14,
      fill:{color:bg}, line:{color:bg, width:0.5}});
    slide.addText(txt, {x:x, y:y, w:pw, h:h, fontSize:9, bold:true, color:color,
      align:'center', valign:'middle', charSpacing:1.2, fontFace:FONT});
  }
  return h;
}

function renderRule(slide, el, x, y, w, dry){
  const h = 0.09;
  if(!dry){
    slide.addShape('roundRect', {x:x, y:y + 0.02, w:0.78, h:0.05, rectRadius:0.03,
      fill:{color:C.brand}, line:{color:C.brand, width:0.5}});
  }
  return h;
}

function renderBig(slide, el, x, y, w, dry){
  const txt = clean(el.textContent);
  const h = 1.15;
  if(!dry) slide.addText(txt, {x:x, y:y, w:w, h:h, fontSize:76, bold:true,
    color:C.brand, fontFace:FONT, valign:'middle'});
  return h;
}

function renderGrid(slide, el, x, y, w, dry){
  const cl = el.classList;
  let cols = 2;
  if(cl.contains('g4')) cols = 4;
  else if(cl.contains('g3')) cols = 3;

  const items = [...el.children].filter(c => c.nodeType === 1);
  if(!items.length) return 0;
  cols = Math.min(cols, items.length);

  const gap = 0.13;
  const colW = (w - gap * (cols - 1)) / cols;
  let cy = y;

  for(let i = 0; i < items.length; i += cols){
    const row = items.slice(i, i + cols);
    const hs = row.map(it => renderBlock(slide, it, 0, 0, colW, true));
    const rowH = Math.max.apply(null, hs.concat([0.30]));

    if(!dry){
      row.forEach((it, j) => {
        renderBlock(slide, it, x + j * (colW + gap), cy, colW, false);
      });
    }
    cy += rowH + gap;
  }
  return cy - y - gap;
}

function renderCard(slide, el, x, y, w, dry){
  const pad = 0.14;
  const innerW = w - pad * 2;
  const kids = [...el.children].filter(c => c.nodeType === 1);
  const tint = el.classList.contains('tint');

  const contentH = kids.length ? stackHeight(slide, kids, innerW, 0.07) : 0.1;
  const h = contentH + pad * 2;

  if(!dry){
    slide.addShape('roundRect', {x:x, y:y, w:w, h:h, rectRadius:0.07,
      fill:{color: tint ? C.surface2 : C.surface},
      line:{color:C.line, width:0.75}});
    let cy = y + pad;
    kids.forEach((k, i) => {
      const kh = renderBlock(slide, k, x + pad, cy, innerW, false);
      cy += kh + (i < kids.length - 1 ? 0.07 : 0);
    });
  }
  return h;
}

function renderCallout(slide, el, x, y, w, dry){
  let accent = C.brand, bg = C.brandSoft;
  if(el.classList.contains('warn')){ accent = C.warn; bg = C.warnSoft; }
  else if(el.classList.contains('danger')){ accent = C.bad; bg = C.badSoft; }
  else if(el.classList.contains('ok')){ accent = C.ok; bg = C.okSoft; }
  else if(el.classList.contains('violet')){ accent = C.violet; bg = C.violetSoft; }

  const pad = 0.13;
  const innerW = w - pad - 0.20;
  const txt = clean(el.textContent);
  if(!txt) return 0;

  const fs = 11.5;
  const lines = estLines(txt, fs, innerW);
  const h = lines * fs * 1.34 / 72 + pad * 2;

  if(!dry){
    slide.addShape('rect', {x:x, y:y, w:w, h:h, fill:{color:bg}, line:{color:bg, width:0.25}});
    slide.addShape('rect', {x:x, y:y, w:0.05, h:h, fill:{color:accent}, line:{color:accent, width:0.25}});
    const runs = inlineRuns(el, {fontSize:fs, color:C.ink, fontFace:FONT});
    slide.addText(runs.length ? runs : txt,
      {x:x + pad + 0.06, y:y + pad, w:innerW, h:h - pad * 2,
       valign:'top', fontFace:FONT, fontSize:fs, color:C.ink});
  }
  return h;
}

function renderTable(slide, tbl, x, y, w, dry){
  if(!tbl) return 0;
  const trs = [...tbl.querySelectorAll('tr')];
  if(!trs.length) return 0;

  const nCols = Math.max.apply(null, trs.map(tr => tr.children.length));
  const colW = w / nCols;

  const rows = [];
  let totalH = 0;

  trs.forEach((tr, ri) => {
    const cells = [...tr.children];
    const isHead = cells[0] && cells[0].tagName === 'TH';
    let maxLines = 1;

    const rowData = cells.map(td => {
      const txt = clean(td.textContent);
      const fs = isHead ? 9 : 10.5;
      maxLines = Math.max(maxLines, estLines(txt, fs, colW - 0.18));
      return {
        text: isHead ? txt.toUpperCase() : txt,
        options: {
          fontSize: fs,
          bold: isHead,
          color: isHead ? 'FFFFFF' : C.ink2,
          fill: {color: isHead ? C.brand : (ri % 2 ? C.surface2 : C.surface)},
          valign: 'middle',
          fontFace: FONT,
          margin: 0.05
        }
      };
    });

    const rowH = maxLines * 10.5 * 1.30 / 72 + 0.13;
    rows.push({cells: rowData, h: rowH});
    totalH += rowH;
  });

  if(!dry){
    slide.addTable(rows.map(r => r.cells), {
      x: x, y: y, w: w,
      colW: new Array(nCols).fill(colW),
      rowH: rows.map(r => r.h),
      border: {type:'solid', color:C.line, pt:0.5},
      fontFace: FONT,
      autoPage: false
    });
  }
  return totalH;
}

function renderStat(slide, el, x, y, w, dry){
  const b = el.querySelector('b');
  const s = el.querySelector('span');
  const bt = b ? clean(b.textContent) : '';
  const st = s ? clean(s.textContent).toUpperCase() : '';
  const h = 0.72;

  if(!dry){
    slide.addShape('roundRect', {x:x, y:y, w:w, h:h, rectRadius:0.09,
      fill:{color:C.surface}, line:{color:C.line, width:0.75}});
    slide.addText(bt, {x:x + 0.05, y:y + 0.07, w:w - 0.10, h:0.34,
      fontSize:18, bold:true, color:C.brand, align:'center', valign:'middle', fontFace:FONT});
    slide.addText(st, {x:x + 0.05, y:y + 0.41, w:w - 0.10, h:0.23,
      fontSize:7, bold:true, color:C.ink3, align:'center', valign:'middle',
      charSpacing:0.8, fontFace:FONT});
  }
  return h;
}

function renderVCard(slide, el, x, y, w, dry){
  const h = 0.64;
  const titleEl = el.querySelector('b');
  const subEl = el.querySelector('span:not(.go)');
  const title = titleEl ? clean(titleEl.textContent) : '';
  const sub = subEl ? clean(subEl.textContent) : '';

    slide.addShape('roundRect', {x:x + 0.12, y:y + 0.13, w:0.38, h:0.38, rectRadius:0.10,
      fill:{color:C.brand}, line:{color:C.brand, width:0.5}});

      color:C.brand, align:'center', valign:'middle'});

function renderPills(slide, el, x, y, w, dry){
  const pills = [...el.children].filter(c => c.nodeType === 1);
  if(!pills.length) return 0;

  const H = 0.27, gapX = 0.08, gapY = 0.09;
  let cx = x, cy = y;

  pills.forEach(p => {
    const t = clean(p.textContent);
    const pw = Math.min(w, t.length * 0.062 + 0.26);
    if(cx + pw > x + w + 0.001){ cx = x; cy += H + gapY; }
    if(!dry){
      const col = pillColor(p), bg = pillBg(p);
      slide.addShape('roundRect', {x:cx, y:cy, w:pw, h:H, rectRadius:0.14,
        fill:{color:bg}, line:{color:bg, width:0.5}});
      slide.addText(t, {x:cx, y:cy, w:pw, h:H, fontSize:9, bold:true, color:col,
        align:'center', valign:'middle', fontFace:FONT});
    }
    cx += pw + gapX;
  });

  return (cy + H) - y;
}

function renderRefPill(slide, el, x, y, w, dry){
  const t = clean(el.textContent);
  if(!t) return 0;
  const h = 0.27;
  const pw = Math.min(w, t.length * 0.062 + 0.28);
  if(!dry){
    slide.addShape('roundRect', {x:x, y:y, w:pw, h:h, rectRadius:0.07,
      fill:{color:C.brandSoft}, line:{color:C.brand, width:0.75, dashType:'dash'}});
    slide.addText(t, {x:x + 0.06, y:y, w:pw - 0.12, h:h, fontSize:8.5, bold:true,
      color:C.brand, valign:'middle', fontFace:FONT});
  }
  return h;
}

function renderActivity(slide, el, x, y, w, dry){
  const pad = 0.17;
  const innerW = w - pad * 2;

  const h3 = el.querySelector('h3');
  const meta = el.querySelector('.meta');
  const list = el.querySelector('ol, ul');

  let listH = 0;
  if(list){
    [...list.children].forEach(li => {
      listH += textH(clean(li.textContent), 11.5, innerW - 0.28) + 0.06;
    });
    if(listH > 0) listH -= 0.06;
  }

  let contentH = 0;
  if(h3) contentH += 0.34;
  if(meta) contentH += 0.32;
  contentH += listH;

  const h = contentH + pad * 2;

  if(!dry){
    slide.addShape('roundRect', {x:x, y:y, w:w, h:h, rectRadius:0.09,
      fill:{color:C.violetSoft}, line:{color:C.violet, width:1.25, dashType:'dash'}});

    let cy = y + pad;

    if(h3){
      slide.addText(clean(h3.textContent), {x:x + pad, y:cy, w:innerW, h:0.32,
        fontSize:14, bold:true, color:C.violet, valign:'middle', fontFace:FONT});
      cy += 0.34;
    }

    if(meta){
      const spans = [...meta.children].filter(s => s.nodeType === 1);
      const runs = spans.map(s => ({text: clean(s.textContent) + '    ',
        options:{fontSize:8.5, bold:true, color:C.violet, fontFace:FONT}}));
      slide.addShape('rect', {x:x + pad, y:cy, w:innerW, h:0.26,
        fill:{color:C.surface}, line:{color:C.surface, width:0.25}});
      slide.addText(runs, {x:x + pad + 0.06, y:cy, w:innerW - 0.12, h:0.26,
        valign:'middle', fontFace:FONT, fontSize:8.5});
      cy += 0.32;
    }

    if(list && listH > 0){
      const isOl = list.tagName === 'OL';
      const paras = [];
      [...list.children].forEach(li => {
        const runs = inlineRuns(li, {fontSize:11.5, color:C.ink2, fontFace:FONT});
        if(!runs.length) return;
        runs[0].options.bullet = isOl ? {type:'number'} : {code:'2022'};
        runs.forEach(r => { r.options.fontSize = 11.5; r.options.color = r.options.color || C.ink2; });
        runs[runs.length - 1].options.breakLine = true;
        paras.push(...runs);
      });
      if(paras.length){
        slide.addText(paras, {x:x + pad, y:cy, w:innerW, h:listH + 0.1,
          valign:'top', fontFace:FONT, fontSize:11.5, color:C.ink2});
      }
    }
  }
  return h;
}

function renderQuiz(slide, el, x, y, w, dry){
  const qs = [...el.querySelectorAll('.q')];
  const score = el.querySelector('.qscore');
  let cy = y;
  let first = true;

  qs.forEach(q => {
    if(!first) cy += 0.13;
    const h = renderQuestion(slide, q, x, cy, w, dry);
    cy += h;
    first = false;
  });

  if(score){
    cy += 0.13;
    const h = renderQScore(slide, score, x, cy, w, dry);
    cy += h;
  }
  return cy - y;
}

function renderQuestion(slide, q, x, y, w, dry){
  const pad = 0.14;
  const innerW = w - pad * 2;

  const qt = q.querySelector('.qtext');
  const qtext = qt ? clean(qt.textContent) : '';
  const qH = textH(qtext, 12, innerW);

  const opts = [...q.querySelectorAll('.opt')];
  const correct = q.dataset.a || '';
  const optHeights = opts.map(o => textH(clean(o.textContent), 11, innerW - 0.28) + 0.16);

  const explain = q.querySelector('.explain');
  const expText = explain ? clean(explain.textContent) : '';
  const expH = expText ? textH(expText, 10.5, innerW - 0.22) + 0.20 : 0;

  let contentH = qH + 0.10;
  optHeights.forEach(oh => { contentH += oh + 0.06; });
  if(expText) contentH += expH + 0.10;
  const h = contentH + pad * 2;

  if(!dry){
    slide.addShape('roundRect', {x:x, y:y, w:w, h:h, rectRadius:0.08,
      fill:{color:C.surface}, line:{color:C.line, width:0.75}});

    let cy = y + pad;
    slide.addText(qtext, {x:x + pad, y:cy, w:innerW, h:qH,
      fontSize:12, bold:true, color:C.ink, valign:'top', fontFace:FONT});
    cy += qH + 0.10;

    opts.forEach((o, i) => {
      const oh = optHeights[i];
      const t = clean(o.textContent);
      const isC = o.dataset.k === correct;
      slide.addShape('roundRect', {x:x + pad, y:cy, w:innerW, h:oh, rectRadius:0.05,
        fill:{color: isC ? C.okSoft : C.surface2},
        line:{color: isC ? C.ok : C.line, width:0.75}});
      slide.addText(t, {x:x + pad + 0.12, y:cy, w:innerW - 0.24, h:oh,
        fontSize:11, color: isC ? C.ok : C.ink2, bold: isC,
        valign:'middle', fontFace:FONT});
      cy += oh + 0.06;
    });

    if(expText){
      cy += 0.04;
      slide.addShape('rect', {x:x + pad, y:cy, w:innerW, h:expH,
        fill:{color:C.brandSoft}, line:{color:C.brandSoft, width:0.25}});
      slide.addShape('rect', {x:x + pad, y:cy, w:0.04, h:expH,
        fill:{color:C.brand}, line:{color:C.brand, width:0.25}});
      slide.addText(expText, {x:x + pad + 0.12, y:cy + 0.06, w:innerW - 0.22, h:expH - 0.12,
        fontSize:10.5, color:C.ink2, valign:'top', fontFace:FONT});
    }
  }
  return h;
}

function renderQScore(slide, el, x, y, w, dry){
  const h = 0.50;
  const b = el.querySelector('b');
  const txt = b ? clean(b.textContent) : 'Score';
  const barEl = el.querySelector('.bar i');
  const pct = barEl ? (parseFloat(barEl.style.width) || 0) : 0;

  if(!dry){
    slide.addShape('roundRect', {x:x, y:y, w:w, h:h, rectRadius:0.08,
      fill:{color:C.surface}, line:{color:C.line, width:0.75}});
    slide.addText(txt, {x:x + 0.16, y:y, w:2.2, h:h, fontSize:11, bold:true,
      color:C.brand, valign:'middle', fontFace:FONT});
    slide.addShape('roundRect', {x:x + 2.5, y:y + 0.19, w:w - 2.80, h:0.12, rectRadius:0.06,
      fill:{color:C.line}, line:{color:C.line, width:0.25}});
    if(pct > 0){
      slide.addShape('roundRect', {x:x + 2.5, y:y + 0.19, w:(w - 2.80) * pct / 100, h:0.12,
        rectRadius:0.06, fill:{color:C.brand}, line:{color:C.brand, width:0.25}});
    }
  }
  return h;
}

function renderImg(slide, el, x, y, w, dry){
  const src = el.getAttribute('src');
  const data = src ? IMG_MAP.get(src) : null;
  const requested = parseFloat(el.dataset.pptW) || 2.10;
  const size = Math.min(w, requested);
  const h = size;

  if(!dry){
    if(data){
      slide.addImage({data:data, x:x + (w - size) / 2, y:y, w:size, h:size});
    } else {
      slide.addShape('rect', {x:x, y:y, w:size, h:size,
        fill:{color:C.surface2}, line:{color:C.line, width:0.75, dashType:'dash'}});
      slide.addText('QR CODE', {x:x, y:y, w:size, h:size, fontSize:12, bold:true,
        color:C.ink3, align:'center', valign:'middle', fontFace:FONT});
    }
  }
  return h;
}

/* =========================================================
   SLIDE FRAME BUILDERS
   ========================================================= */
function drawHeader(slide, kickerEl, titleEl, modText, cont){
  slide.background = {color:C.surface};

  slide.addShape('rect', {x:0, y:0, w:SW, h:0.88,
    fill:{color:C.surface2}, line:{color:C.surface2, width:0.25}});
  slide.addShape('rect', {x:0, y:0.88, w:SW, h:0.05,
    fill:{color:C.brand}, line:{color:C.brand, width:0.25}});

  const kickerTxt = kickerEl ? clean(kickerEl.textContent).toUpperCase() : '';
  if(kickerTxt){
    slide.addText(kickerTxt, {x:MX, y:0.09, w:6.4, h:0.24,
      fontSize:8.5, bold:true, color:C.brand, charSpacing:1.3,
      valign:'middle', fontFace:FONT});
  }
  const titleTxt = (titleEl ? clean(titleEl.textContent) : '') + (cont ? '  (cont.)' : '');
  slide.addText(titleTxt, {x:MX, y:0.31, w:7.6, h:0.50,
    fontSize:18, bold:true, color:C.ink, valign:'middle', fontFace:FONT});

  if(modText){
    slide.addText(modText.toUpperCase(), {x:6.9, y:0.12, w:2.65, h:0.24,
      fontSize:7.5, bold:true, color:C.ink3, align:'right', valign:'middle',
      charSpacing:1, fontFace:FONT});
  }

  slide.addShape('rect', {x:0, y:SH - 0.30, w:SW, h:0.30,
    fill:{color:C.surface2}, line:{color:C.surface2, width:0.25}});
  slide.addText('Basic Microbiology — QC Yearly Training Plan 2026  |  Prepared by Muhammad Firdaus Abdullah',
    {x:MX, y:SH - 0.30, w:7.4, h:0.30, fontSize:7.5, color:C.ink3,
     valign:'middle', fontFace:FONT});
  slide.addText(String(SLIDE_NO) + ' / ' + SLIDES.length,
    {x:SW - 1.35, y:SH - 0.30, w:0.9, h:0.30, fontSize:7.5, color:C.ink3,
     align:'right', valign:'middle', fontFace:FONT});
}

function renderDividerSlide(pptx, sec, data){
  const slide = pptx.addSlide();
  SLIDE_NO++;
  slide.background = {color:C.surface};

  slide.addShape('rect', {x:0, y:0, w:0.16, h:SH,
    fill:{color:C.brand}, line:{color:C.brand, width:0.25}});
  slide.addShape('rect', {x:0, y:0, w:SW, h:0.10,
    fill:{color:C.brandSoft}, line:{color:C.brandSoft, width:0.25}});

  const divider = sec.querySelector('.divider') || sec;
  const kids = [...divider.children].filter(c => c.nodeType === 1);

  const W = 8.5;
  const X = 0.85;
  const gap = 0.14;

  let total = 0;
  kids.forEach((k, i) => {
    total += renderBlock(slide, k, 0, 0, W, true);
    if(i < kids.length - 1) total += gap;
  });

  let cy = Math.max(0.55, (SH - total) / 2);
  kids.forEach((k, i) => {
    const h = renderBlock(slide, k, X, cy, W, false);
    cy += h + (i < kids.length - 1 ? gap : 0);
  });

  slide.addText('QC Yearly Training Plan 2026  ·  Basic Microbiology',
    {x:0.85, y:SH - 0.42, w:8.5, h:0.26, fontSize:8, color:C.ink3,
     valign:'middle', fontFace:FONT});

  return slide;
}

function renderContentSlide(pptx, sec, data){
  const kids = [...sec.children].filter(c => c.nodeType === 1);
  const kicker = kids.find(c => c.classList && c.classList.contains('kicker'));
  const h2 = kids.find(c => c.tagName === 'H2');
  const rule = kids.find(c => c.classList && c.classList.contains('rule'));
  const blocks = kids.filter(c => c !== kicker && c !== h2 && c !== rule);

  let slide = null;
  let cy = 0;
  let page = 0;

  const startPage = () => {
    slide = pptx.addSlide();
    SLIDE_NO++;
    drawHeader(slide, kicker, h2, data.mod, page > 0);
    cy = CTOP;
    page++;
  };

  startPage();

  blocks.forEach(b => {
    const h = renderBlock(slide, b, MX, cy, CW, true);
    if(h <= 0) return;

    if(cy + h > CBOT && cy > CTOP + 0.10){
      startPage();
    }
    renderBlock(slide, b, MX, cy, CW, false);
    cy += h + 0.14;
  });
}

/* =========================================================
   IMAGE PRE-FETCH (QR codes → data URLs, so they embed)
   ========================================================= */
function toDataURL(url){
  return new Promise(resolve => {
    fetch(url, {mode:'cors'})
      .then(r => r.blob())
      .then(b => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = () => resolve(null);
        fr.readAsDataURL(b);
      })
      .catch(() => resolve(null));
  });
}

async function preloadImages(){
  const map = new Map();
  const imgs = [...document.querySelectorAll('.slide img')];
  await Promise.all(imgs.map(async img => {
    const src = img.getAttribute('src');
    if(!src || map.has(src)) return;
    const d = await toDataURL(src);
    if(d) map.set(src, d);
  }));
  return map;
}

/* =========================================================
   EXPORT HANDLER
   ========================================================= */
dlBtn.addEventListener('click', async e => {
  e.stopPropagation();

  if(typeof PptxGenJS === 'undefined'){
    showToast('⚠ PowerPoint library not loaded. Check internet connection.');
    return;
  }

  dlbar.classList.add('show');

  try{
    SLIDE_NO = 0;
    IMG_MAP = await preloadImages();

    const pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_16x9';
    pptx.author = 'Muhammad Firdaus Abdullah';
    pptx.company = 'QC Yearly Training Plan 2026';
    pptx.title = 'Basic Microbiology — QC Yearly Training Plan 2026';
    pptx.subject = 'Basic Microbiology Training';

    SLIDES.forEach((s, i) => {
      const clone = sections[i].cloneNode(true);
      const first = clone.firstElementChild;
      const isDivider = first && first.classList && first.classList.contains('divider');

      if(isDivider){
        renderDividerSlide(pptx, clone, s);
      } else {
        renderContentSlide(pptx, clone, s);
      }
    });

    await pptx.writeFile({fileName: 'Basic-Microbiology-QC-Training-2026.pptx'});
    showToast('✅ PowerPoint downloaded successfully!');
  }catch(err){
    console.error(err);
    showToast('⚠ Failed to generate PowerPoint: ' + err.message);
  }finally{
    dlbar.classList.remove('show');
  }
});

/* =========================================================
   INIT

show(0);
